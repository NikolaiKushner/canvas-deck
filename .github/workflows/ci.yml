name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path Packages/CanvasKit

  build:
    name: App build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project CanvasDeck.xcodeproj -scheme CanvasDeck -configuration Release \
            -derivedDataPath build -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build
